# The Site Configuration
theme: jekyll-theme-chirpy

# 기본 언어 및 타임존
lang: en
timezone: Asia/Seoul

# 사이트 기본 정보
title: Best Temp in Chiswick
tagline: Bits and Bobs of the Life
description: Bits and Bobs of the Life

# 배포 주소 (필수)
url: 'https://besttempinchiswick.github.io'
avatar: 'assets/IMG_0812.jpg'

# 작성자 정보
author: besttempinchiswick

# 소셜 링크 (필요한 GitHub만 남김)
social:
  name: besttempinchiswick
  links:
    - https://github.com/besttempinchiswick

# 목차(TOC) 표시
toc: true

# 다크모드 토글 비활성화, 라이트 모드로 고정 (임시)
theme_mode: light

# PWA (웹앱 설치 기능)
pwa:
  enabled: true
  cache:
    enabled: true

paginate: 10
baseurl: ""

# ------------ 이하 Jekyll 및 Chirpy 테마 필수 기본값 (수정 불필요) ------------

kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
